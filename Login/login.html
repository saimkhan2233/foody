<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="container">
        <div class="signup-page">
            <img src="roast_chicken-removebg-preview.png" alt="Chicken" class="chicken-img">
            <div class="imgs">
                <img src="pngtree-the-delivery-man-icon-rides-a-motorbike-png-image_3343631-removebg-preview.png" alt="Rider" class="rider-img">
            </div>
        </div>

        <div class="signup-page2">
            <h1 class="signup-heading">LogIn</h1>
            
            <div class="placements">
                <input type="email" id="login-email" placeholder="Enter Email">
                <input type="password" id="login-password" placeholder="Enter Password">
            </div>

            <button id="login-btn" class="signup-btn">LogIn</button>

            <div class="login-footer-row">
                <h3 class="heading-login">Forget Password? <span>Send Email</span></h3>
                <div class="grey-separator"></div>
                <img id="google-login-btn" class="google-btn" src="pngtree-google-internet-icon-vector-png-image_9183287-removebg-preview.png" alt="Google" style="cursor:pointer;">
            </div>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
