<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp - FoodStore</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="signup.css">
</head>
<body>

    <div class="container">
        <div class="signup-page">
            <img src="roast_chicken-removebg-preview.png" alt="Chicken" class="chicken-img">
            <div class="imgs">
                <img src="pngtree-the-delivery-man-icon-rides-a-motorbike-png-image_3343631-removebg-preview.png" alt="Rider" class="rider-img">
            </div>
        </div>

        <div class="signup-page2">
            <h1 class="signup-heading">SignUp</h1>
            
            <div class="placements">
                <input type="text" placeholder="Enter Name" id="username">
                <input type="email" placeholder="Enter Email" id="useremail">
                
                <select id="userrole">
                    <option value="" disabled selected>Select Your Role</option>
                    <option value="customer">Customer</option>
                    <option value="vendor">Vendor</option>
                </select>
                
                <input type="password" placeholder="Enter Password" id="userpassword">
            </div>

            <button id="signup-btn">SignUp</button>

            <div class="login-footer-row">
                <h3 class="heading-login">Have Account Already? <a href="login.html" style="text-decoration: none;"><span>LogIn</span></a></h3>
                <div class="grey-separator"></div>
                <img class="google-btn" src="pngtree-google-internet-icon-vector-png-image_9183287-removebg-preview.png" alt="Google">
            </div>
        </div>
    </div>

    <script type="module" src="signup.js"></script>
</body>
</html>
