<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spot | Admin Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="dashboard-container">
        <header class="glass-header">
            <div class="logo-area">
                <span class="logo-dot"></span>
                <h1>Admin Panel</h1>
            </div>
            <div class="header-actions">
                <a href="adminVerify.html" style="text-decoration: none;"><button id="view-queue-btn" class="queue-pill">Verification Vendor List</button></a>
                
                <button id="theme-toggle" class="theme-btn">
                    <span id="theme-icon">☀️</span>
                </button>
                <button id="admin-logout-btn" class="logout-pill">Logout Admin</button>
            </div>
        </header>

        <main class="content-wrapper">
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">Total Requests</span>
                    <span id="total-count" class="stat-value">--</span>
                </div>
                <div class="stat-card pending">
                    <span class="stat-label">Pending</span>
                    <span id="pending-count" class="stat-value">--</span>
                </div>
                <div class="stat-card verified">
                    <span class="stat-label">Verified</span>
                    <span id="verified-count" class="stat-value">--</span>
                </div>
            </div>

            <div id="users"></div>
        </main>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
